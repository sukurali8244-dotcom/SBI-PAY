<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service</title>
  <style>
    :root{--green:#129668;--page:#f4f8ff;--muted:#7f8b99}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:#20272c;font-family:"Trebuchet MS",Arial,sans-serif}.service-shell{width:min(100%,576px);min-height:100vh;margin:auto;padding-bottom:30px}.service-header{height:162px;padding:56px 24px 18px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}.service-header h1{margin:0;color:var(--green);font-size:38px}.back-link{position:absolute;left:24px;bottom:18px;color:var(--green);font-size:42px;line-height:1;text-decoration:none}.service-list{padding:34px 18px}.service-card{display:flex;align-items:center;gap:18px;padding:22px;background:#fff;border-radius:18px;box-shadow:0 6px 16px rgba(35,63,74,.06);margin-bottom:18px}.service-logo{width:84px;height:84px;flex:0 0 84px;object-fit:cover;border-radius:16px}.service-copy{min-width:0;flex:1}.service-copy strong{display:block;font-size:25px}.service-copy span{display:block;margin-top:7px;color:var(--muted);font-size:19px}.service-link{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 20px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;font-size:18px;font-weight:700;white-space:nowrap}.service-link:focus-visible{outline:3px solid #f5c62d;outline-offset:3px}@media(max-width:390px){.service-card{gap:11px;padding:15px}.service-logo{width:70px;height:70px;flex-basis:70px}.service-copy strong{font-size:20px}.service-copy span{font-size:15px}.service-link{padding:0 13px;font-size:15px}}
  </style>
</head>
<body>
  <main class="service-shell">
    <header class="service-header"><a class="back-link" href="my.html" aria-label="Back">&#8592;</a><h1>Service</h1></header>
    <section class="service-list" aria-label="Customer service links">
      <article class="service-card"><img class="service-logo" src="service-logo.png" alt="Customer service logo"><div class="service-copy"><strong>SBI PAY</strong><span>Customer Service</span></div><a class="service-link" href="https://t.me/SBIpayCSR001" target="_blank" rel="noopener">Contact</a></article>
      <article class="service-card"><img class="service-logo" src="service-logo.png" alt="Customer service logo"><div class="service-copy"><strong>SBI PAY</strong><span>Customer Service</span></div><a class="service-link" href="https://t.me/mhighost" target="_blank" rel="noopener">Contact</a></article>
      <article class="service-card"><img class="service-logo" src="service-logo.png" alt="Customer service logo"><div class="service-copy"><strong>SBI PAY</strong><span>Group</span></div><a class="service-link" href="https://t.me/sbipaygroup" target="_blank" rel="noopener">Group</a></article>
      <article class="service-card"><img class="service-logo" src="service-logo.png" alt="Customer service logo"><div class="service-copy"><strong>SBI PAY</strong><span>Official Channel</span></div><a class="service-link" href="https://t.me/sbipayofficialchannel" target="_blank" rel="noopener">channel</a></article>
    </section>
  </main>
</body>
</html>
