<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Add UPI</title>
<link rel="stylesheet" href="dashboard.css">
<style>
:root{--green:#129668;--ink:#172333;--muted:#718091;--page:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:"Trebuchet MS",Arial,sans-serif}.upi-page{width:min(100%,576px);min-height:100vh;margin:auto;padding-bottom:30px}.upi-header{height:112px;padding:50px 22px 16px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}.upi-header h1{margin:0;color:var(--green);font-size:30px}.back{position:absolute;left:20px;bottom:15px;color:var(--green);font:40px/1 Arial;text-decoration:none}.upi-content{padding:18px 18px 30px}.selected-app{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:18px;box-shadow:0 5px 15px rgba(35,63,74,.06)}.logo{display:grid;place-items:center;width:58px;height:58px;flex:0 0 58px;border:1px solid #dce8e5;border-radius:14px;background:#fff;overflow:hidden}.logo img{display:block;width:100%;height:100%;padding:9px;object-fit:contain}.selected-app strong{display:block;font-size:22px}.selected-app span{display:block;margin-top:4px;color:var(--muted);font-size:14px}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:18px 0 12px;padding:4px;border:1px solid #cfe0dc;border-radius:20px;background:#edf6f3}.mode-tabs button{padding:11px;border:0;border-radius:16px;background:transparent;color:var(--muted);font:700 17px inherit}.mode-tabs button.active{background:var(--green);color:#fff}.app-list{display:grid;gap:9px;max-height:270px;overflow-y:auto;padding:2px 4px 6px 0}.app-list::-webkit-scrollbar{width:7px}.app-list::-webkit-scrollbar-thumb{background:#b9d8cf;border-radius:8px}.app-choice{display:flex;align-items:center;gap:12px;width:100%;padding:11px;border:1px solid #e2e8e8;border-radius:15px;background:#fff;color:var(--ink);text-align:left;text-decoration:none}.app-choice .logo{width:44px;height:44px;flex-basis:44px;border-radius:11px}.app-choice .logo img{padding:7px}.app-choice strong{font-size:17px}.payout{margin-left:auto;color:var(--green);font-size:13px;font-weight:700}.form-card{margin-top:18px;padding:18px;background:#fff;border-radius:18px;box-shadow:0 5px 15px rgba(35,63,74,.06)}.field{display:grid;gap:6px;margin-bottom:12px;color:#566779;font-size:15px;font-weight:700}.field input{width:100%;padding:13px;border:1px solid #cddbd9;border-radius:12px;background:#fbfdfd;color:var(--ink);font:16px inherit}.toggle{display:flex;align-items:center;gap:8px;margin:12px 0;color:#566779;font-size:15px}.toggle input{width:20px;height:20px;accent-color:#f5c62d}.limit-box{display:grid;grid-template-columns:1fr 1fr;gap:10px}.error{min-height:20px;color:#d85243;font-size:14px}.success{min-height:20px;color:var(--green);font-size:14px}.save{width:100%;padding:14px;border:0;border-radius:24px;background:var(--green);color:#fff;font:700 18px inherit}.saved{margin-top:18px}.saved h2{margin:0 0 10px;color:var(--green);font-size:21px}.saved-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e0e8e7}.saved-row:last-child{border-bottom:0}.saved-row small{display:block;margin-top:3px;color:var(--muted)}@media(max-width:600px){body{zoom:1!important}.upi-page{width:100%;max-width:576px}.upi-header h1{font-size:27px}.upi-content{padding:15px}.selected-app{padding:13px}.form-card{padding:15px}}
</style>
</head>
<body><main class="upi-page"><header class="upi-header"><a class="back" href="wallet.html" aria-label="Back">&#8592;</a><h1>Add UPI Account</h1></header><section class="upi-content"><div class="selected-app"><span class="logo" id="selected-logo"></span><div><strong id="selected-name">Choose an app</strong><span id="selected-mode">Personal receiving account</span></div></div><div class="mode-tabs"><button id="personal-tab" class="active" type="button">Personal</button><button id="business-tab" type="button">Business</button></div><div class="app-list" id="app-list"></div><form class="form-card" id="upi-form"><label class="field">UPI ID<input id="upi-id" required placeholder="example@upi" autocomplete="off"></label><div class="limit-box"><label class="field">Minimum<input id="limit-min" type="number" min="0" step="0.01" value="10" required></label><label class="field">Maximum<input id="limit-max" type="number" min="0.01" step="0.01" value="100000" required></label></div><label class="toggle"><input id="enabled" type="checkbox" checked> Receiving enabled</label><div class="error" id="error"></div><div class="success" id="success"></div><button class="save" type="submit">Save UPI Details</button></form><section class="saved"><h2>Saved UPI Accounts</h2><div id="saved-list"></div></section></section></main><script>
const params=new URLSearchParams(location.search),logoFiles={googlepay:'googlepay.svg',phonepe:'phonepe.svg',paytm:'paytm.svg',bhim:'bhim.svg',whatsapp:'whatsapp.svg',amazonpay:'amazonpay.svg',freecharge:'freecharge.svg',navi:'navi.svg',cred:'cred.svg',bharatpe:'bharatpe.svg'};
const apps={personal:[['Google Pay','googlepay','Pay In'],['PhonePe','phonepe','Pay In'],['Paytm','paytm','Payout'],['BHIM','bhim','Pay In'],['Mobikwik','paytm','Payout'],['Amazon Pay','amazonpay','Pay In'],['WhatsApp Pay','whatsapp','Pay In'],['Freecharge','freecharge','Payout'],['Navi','navi','Pay In'],['CRED Pay','cred','Pay In']],business:[['Google Pay Business','googlepay',''],['PhonePe Business','phonepe',''],['Paytm Business','paytm',''],['BharatPe Business','bharatpe','']]};
let mode=params.get('mode')==='business'?'business':'personal',selectedLogo=params.get('logo')||'paytm',selectedName=params.get('app')||'Paytm';const read=()=>{try{const value=JSON.parse(localStorage.getItem('sbiPayWalletUpi')||'[]');return Array.isArray(value)?value:[]}catch(error){return[]}};const write=value=>localStorage.setItem('sbiPayWalletUpi',JSON.stringify(value));const logoMarkup=slug=>logoFiles[slug]?`<img src="assets/logos/${logoFiles[slug]}" alt="${selectedName} logo">`:'<span>UPI</span>';
const selectedLogoElement=document.getElementById('selected-logo'),selectedNameElement=document.getElementById('selected-name'),selectedMode=document.getElementById('selected-mode'),appList=document.getElementById('app-list');const renderSelected=()=>{selectedLogoElement.innerHTML=logoMarkup(selectedLogo);selectedNameElement.textContent=selectedName;selectedMode.textContent=mode==='business'?'Business withdrawal account':'Personal receiving account';document.getElementById('personal-tab').classList.toggle('active',mode==='personal');document.getElementById('business-tab').classList.toggle('active',mode==='business')};const renderApps=()=>{appList.innerHTML=apps[mode].map(app=>`<a class="app-choice" href="wallet_upi.html?app=${encodeURIComponent(app[0])}&logo=${app[1]}&mode=${mode}"><span class="logo">${logoFiles[app[1]]?`<img src="assets/logos/${logoFiles[app[1]]}" alt="${app[0]} logo">`:''}</span><strong>${app[0]}</strong>${app[2]?`<span class="payout">${app[2]}</span>`:''}</a>`).join('')};const renderSaved=()=>{const list=document.getElementById('saved-list'),entries=read();list.innerHTML=entries.length?entries.map(entry=>`<div class="saved-row"><div><strong>${entry.app}</strong><small>${entry.upiId}<br>Limit: ${Number(entry.min).toFixed(2)} - ${Number(entry.max).toFixed(2)}</small></div><label class="toggle"><input type="checkbox" data-toggle="${entry.id}" ${entry.enabled?'checked':''}> Enabled</label></div>`).join(''):'<small>No UPI accounts saved yet.</small>'};
document.getElementById('personal-tab').addEventListener('click',()=>{mode='personal';selectedName='Choose an app';selectedLogo='paytm';renderSelected();renderApps()});document.getElementById('business-tab').addEventListener('click',()=>{mode='business';selectedName='Choose an app';selectedLogo='paytm';renderSelected();renderApps()});document.getElementById('upi-form').addEventListener('submit',event=>{event.preventDefault();const value=document.getElementById('upi-id').value.trim(),min=Number(document.getElementById('limit-min').value),max=Number(document.getElementById('limit-max').value),error=document.getElementById('error'),entries=read();error.textContent='';if(!/^[^\s@]+@[^\s@]+$/.test(value)){error.textContent='Enter a valid UPI ID.';return}if(min<0||max<=min){error.textContent='Maximum must be greater than minimum.';return}if(entries.some(entry=>entry.upiId.toLowerCase()===value.toLowerCase())){error.textContent='This UPI ID is already saved.';return}entries.push({id:`upi-${Date.now()}`,app:selectedName,logo:selectedName,iconSlug:selectedLogo,upiId:value,enabled:document.getElementById('enabled').checked,min,max,mode});write(entries);document.getElementById('success').textContent='UPI details saved permanently.';renderSaved();event.target.reset();document.getElementById('limit-min').value=10;document.getElementById('limit-max').value=100000;document.getElementById('enabled').checked=true});document.getElementById('saved-list').addEventListener('change',event=>{const input=event.target.closest('[data-toggle]');if(!input)return;const entries=read(),entry=entries.find(item=>item.id===input.dataset.toggle);if(entry){entry.enabled=input.checked;write(entries);renderSaved()}});renderSelected();renderApps();renderSaved();
</script></body></html>
