<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Asset</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    :root{--page:#f4f8ff;--green:#129668;--dark:#252a2d;--muted:#636a70;--mint:#e5f5f0;--blue:#5885e2;--purple:#8058de;--yellow:#f5c526}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--dark);font-family:"Trebuchet MS",Arial,sans-serif}.asset-shell{width:min(100%,576px);min-height:100vh;margin:auto;padding:0 8px 125px;overflow:hidden}.asset-header{height:214px;display:flex;align-items:center;justify-content:center}.asset-header h1{margin:22px 0 0;color:var(--green);font-size:42px;letter-spacing:.2px}.asset-card{padding:24px 26px 20px;background:#fff;border-radius:25px;box-shadow:0 8px 22px rgba(47,92,85,.08)}.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.asset-item{min-height:124px;padding:18px 16px;border-radius:16px;background:#eef8f5}.asset-item.commission{grid-column:1}.asset-label{display:flex;align-items:center;gap:12px;color:#545b60;font-size:23px}.asset-icon{display:grid;place-items:center;width:49px;height:49px;border-radius:14px;background:#c9eee1;color:var(--blue);font-size:28px;font-weight:700}.asset-item:nth-child(2) .asset-icon{color:var(--purple)}.asset-item:nth-child(3) .asset-icon{color:#e8ad00}.asset-value{margin-top:10px;font-size:27px;font-weight:800}.asset-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 24px;margin:66px auto 0;padding:0 68px}.asset-action{display:flex;flex-direction:column;align-items:center;gap:12px;border:0;background:transparent;color:#171b1e;font:22px inherit;cursor:pointer;text-decoration:none}.asset-action-icon{position:relative;display:block;width:74px;height:74px;border-radius:16px;background:#e0f1ed;color:#20282b;line-height:1}.asset-action-icon:before,.asset-action-icon:after{content:"";position:absolute}.wallet-shape:before{left:18px;top:25px;width:38px;height:32px;border:3px solid #20282b;border-radius:4px}.wallet-shape:after{left:20px;top:17px;width:34px;height:10px;border-top:3px solid #20282b;border-bottom:3px solid #20282b}.coins-shape:before{left:17px;top:27px;width:23px;height:27px;border:3px solid #20282b;border-radius:50% 50% 42% 42%}.coins-shape:after{left:33px;top:35px;width:24px;height:24px;border:3px solid #20282b;border-radius:50%}.service-shape:before{left:19px;top:18px;width:30px;height:38px;border:3px solid #20282b;border-top-color:transparent;border-radius:18px}.service-shape:after{left:13px;top:31px;width:8px;height:17px;border:3px solid #20282b;border-radius:8px;box-shadow:40px 0 0 -3px #e0f1ed,40px 0 0 0 #20282b}.message-shape:before{left:18px;top:18px;width:38px;height:36px;border:3px solid #20282b;border-radius:17px}.message-shape:after{left:27px;top:31px;width:21px;height:3px;background:#20282b;box-shadow:0 8px 0 #20282b}.pin-shape:before{left:18px;top:16px;width:38px;height:43px;border:3px solid #20282b;border-radius:20px 20px 16px 16px}.pin-shape:after{left:28px;top:30px;width:18px;height:3px;background:#20282b;box-shadow:0 8px 0 #20282b}.book-shape:before{left:17px;top:17px;width:39px;height:40px;border:3px solid #20282b;border-radius:4px}.book-shape:after{left:36px;top:18px;width:3px;height:38px;background:#20282b}.asset-action:focus-visible{outline:3px solid var(--green);outline-offset:4px;border-radius:8px}.version{margin:25px 0 0;text-align:right;color:#60a78f;font-size:16px;letter-spacing:1px}.logout{display:block;width:72%;margin:31px auto 0;padding:14px;border:0;border-radius:30px;background:#0da563;color:#fff;text-align:center;font:700 24px inherit;box-shadow:0 7px 13px rgba(13,165,99,.16);cursor:pointer}.logout:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}.reference-nav{position:fixed;z-index:50;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,576px);height:88px;padding:8px 10px 7px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#fff;border-top:1px solid #e5e5e5;box-shadow:0 -2px 12px rgba(0,0,0,.08)}.reference-nav a{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:2px 0;color:#b7b7b7;text-decoration:none;font-size:16px;font-weight:700;line-height:1.1}.reference-nav .nav-icon{position:relative;display:block;width:50px;height:50px;color:#b7b7b7;font-size:0}.reference-nav a.active{color:#079e65}.reference-nav a.active .nav-icon{color:#fff;background:#079e65;border-radius:50%;font-size:0}.reference-nav a.wallet-active .nav-icon{border-radius:50%;background:var(--yellow);color:#343434;box-shadow:0 1px 3px rgba(0,0,0,.12)}.reference-nav a:focus-visible{outline:2px solid #08a66a;outline-offset:-2px}.nav-home:before{content:"";position:absolute;left:12px;top:16px;width:27px;height:24px;background:currentColor}.nav-home:after{content:"";position:absolute;left:9px;top:8px;width:33px;height:33px;background:currentColor;transform:rotate(45deg);border-radius:4px}.nav-payment:before{content:"";position:absolute;left:9px;top:14px;width:32px;height:24px;border:3px solid currentColor;border-radius:3px}.nav-payment:after{content:"";position:absolute;left:12px;top:25px;width:27px;border-top:3px solid currentColor}.nav-wallet:before{content:"";position:absolute;left:10px;top:18px;width:30px;height:24px;border:3px solid currentColor;border-radius:4px}.nav-wallet:after{content:"";position:absolute;left:16px;top:11px;width:26px;height:9px;border-top:3px solid currentColor;border-bottom:3px solid currentColor}.nav-stat:before{content:"";position:absolute;left:9px;top:11px;width:32px;height:29px;border:3px solid currentColor;border-radius:50%}.nav-stat:after{content:"";position:absolute;left:18px;top:18px;width:14px;height:14px;background:currentColor;border-radius:50%}.nav-my:before{content:"";position:absolute;left:9px;top:11px;width:32px;height:32px;border-radius:50%;background:currentColor}.nav-my:after{content:"";position:absolute;left:18px;top:20px;width:14px;height:5px;background:#fff;border-radius:5px}.reference-nav a.active .nav-my:after{background:var(--green)}.modal-backdrop{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(22,32,43,.58)}.modal-backdrop.open{display:grid}.modal{width:min(100%,430px);padding:27px 22px;background:#fff;border-radius:23px;box-shadow:0 20px 50px rgba(0,0,0,.22)}.modal h2{margin:0;color:var(--green);font-size:29px}.modal p{color:#657383;font-size:17px;line-height:1.4}.modal-close{float:right;border:0;background:#eaf5f1;color:#68777f;border-radius:50%;width:35px;height:35px;font-size:23px;cursor:pointer}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.modal-actions button{min-height:54px;border-radius:28px;font:700 18px inherit;cursor:pointer}.cancel{border:1px solid #cadbd6;background:#fff;color:var(--green)}.confirm{border:0;background:var(--green);color:#fff}.service-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #dce7e4;color:var(--dark);text-decoration:none;font-size:18px}.service-row:last-child{border:0}.service-row img{width:52px;height:52px;object-fit:cover;border-radius:13px}.pin-form{display:grid;gap:11px}.pin-form label{display:grid;gap:5px;color:#68777f;font-size:15px;font-weight:700}.pin-form input{padding:13px;border:1px solid #cbdad6;border-radius:12px;font:16px inherit}.pin-error{min-height:18px;color:#d74d4d;font-size:14px}
    @media(max-width:390px){.asset-shell{padding-left:7px;padding-right:7px}.asset-header{height:190px}.asset-header h1{font-size:36px}.asset-card{padding-left:18px;padding-right:18px}.asset-label{font-size:18px}.asset-value{font-size:23px}.asset-actions{padding:0 32px;gap:25px 15px}.asset-action{font-size:18px}.asset-action-icon{width:64px;height:64px;font-size:36px}.reference-nav a{font-size:14px}.reference-nav .nav-icon{width:44px;height:44px;font-size:31px}}
    .wallet-shape{background-image:linear-gradient(#20282b,#20282b),linear-gradient(#20282b,#20282b);background-repeat:no-repeat;background-size:38px 3px,34px 3px;background-position:18px 16px,20px 21px}.wallet-shape:after{content:"¥";left:29px;top:29px;font:27px/1 Arial,sans-serif}.pin-shape:before{left:18px;top:14px;width:39px;height:47px;background:#20282b;border:0;border-radius:0;clip-path:polygon(50% 0,100% 16%,92% 67%,72% 88%,50% 100%,28% 88%,8% 67%,0 16%)}.pin-shape:after{content:"✓";left:28px;top:28px;width:auto;height:auto;background:transparent;color:#e0f1ed;font:28px/1 Arial,sans-serif;box-shadow:none}
    @media(max-width:600px){.asset-shell{width:100%;max-width:576px;padding:0 8px 92px}.asset-header{height:130px}.asset-header h1{margin:12px 0 0;font-size:30px}.asset-card{padding:14px 16px 12px;border-radius:18px}.asset-grid{gap:10px}.asset-item{min-height:78px;padding:10px 11px;border-radius:12px}.asset-label{gap:8px;font-size:15px}.asset-icon{width:34px;height:34px;border-radius:10px;font-size:20px}.asset-value{margin-top:6px;font-size:18px}.version{margin:14px 0 0;font-size:13px}.asset-actions{gap:18px 12px;margin:30px auto 0;padding:0 28px}.asset-action{gap:7px;font-size:15px}.asset-action-icon{width:52px;height:52px;border-radius:12px}.logout{width:68%;margin-top:22px;padding:11px;font-size:19px}.reference-nav{height:70px;padding:5px 8px}.reference-nav a{font-size:12px}.reference-nav .nav-icon{width:36px;height:36px;font-size:26px}}
  </style>
</head>
<body>
  <main class="asset-shell">
    <header class="asset-header"><h1>My Asset</h1></header>
    <section class="asset-card" aria-label="Asset summary"><div class="asset-grid"><div class="asset-item"><div class="asset-label"><span class="asset-icon">▤</span>Deposit</div><div class="asset-value" id="total-deposit">₹ 0.00</div></div><div class="asset-item"><div class="asset-label"><span class="asset-icon">$</span>Withdraw</div><div class="asset-value" id="total-withdrawal">₹ 0.00</div></div><div class="asset-item commission"><div class="asset-label"><span class="asset-icon">↻</span>Commission</div><div class="asset-value" id="total-commission">₹ 0.00</div></div></div><div class="version">v1.0.2</div></section>
    <section class="asset-actions" aria-label="Account actions"><a class="asset-action" href="wallet.html"><span class="asset-action-icon wallet-shape"></span><span>Wallet</span></a><a class="asset-action" href="details.html"><span class="asset-action-icon coins-shape"></span><span>Integral</span></a><a class="asset-action" href="service.html"><span class="asset-action-icon service-shape"></span><span>Service</span></a><a class="asset-action" href="notification.html"><span class="asset-action-icon message-shape"></span><span>Message</span></a><button class="asset-action" id="pin-button" type="button"><span class="asset-action-icon pin-shape"></span><span>Pin</span></button><button class="asset-action" id="tutorial-button" type="button"><span class="asset-action-icon book-shape"></span><span>Tutorial</span></button></section>
    <button class="logout" id="logout-button" type="button">Logout</button>
    <nav class="reference-nav" aria-label="Main navigation"><a href="dashboard.html"><span class="nav-icon">⌂</span><span>Home</span></a><a href="payment.html"><span class="nav-icon">▤</span><span>Payment</span></a><a class="wallet-active" href="wallet.html"><span class="nav-icon">▣</span><span>Wallet</span></a><a href="statistics.html"><span class="nav-icon">◌</span><span>Statistics</span></a><a class="active" href="my.html"><span class="nav-icon">◉</span><span>My</span></a></nav>
  </main>
  <div class="modal-backdrop" id="tutorial-modal"><section class="modal"><button class="modal-close" data-close="tutorial-modal" type="button">&times;</button><h2>Tutorial</h2><p style="text-align:center;margin:45px 0;color:#a0a9b0">No tutorial available</p></section></div>
  <div class="modal-backdrop" id="pin-modal"><section class="modal"><button class="modal-close" data-close="pin-modal" type="button">&times;</button><h2>Pin Code</h2><p>Enter Your Pin</p><form class="pin-form" id="pin-form"><label id="old-pin-label">Old Pin (If You Set)<input id="old-pin" type="password" inputmode="numeric" maxlength="6"></label><label>New Pin<input id="new-pin" type="password" inputmode="numeric" maxlength="6" required></label><label>Confirm New Pin<input id="confirm-pin" type="password" inputmode="numeric" maxlength="6" required></label><div class="pin-error" id="pin-error"></div><button class="confirm" type="submit">Confirm</button></form></section></div>
  <div class="modal-backdrop" id="logout-modal"><section class="modal"><button class="modal-close" data-close="logout-modal" type="button">&times;</button><h2>Logout?</h2><p>Are you sure you want to logout?</p><div class="modal-actions"><button class="cancel" data-close="logout-modal" type="button">Cancel</button><button class="confirm" id="confirm-logout" type="button">Logout</button></div></section></div>
  <script src="transactions.js"></script>
  <script>
    const money=value=>`₹ ${Number(value||0).toFixed(2)}`;const renderAssets=()=>{const records=sbiPayTransactions.read().filter(record=>record.currency==='INR');const deposits=records.filter(record=>record.direction==='receive'&&record.status==='success').reduce((sum,record)=>sum+record.amount,0);const withdrawals=records.filter(record=>record.direction==='purchase'&&record.status==='success').reduce((sum,record)=>sum+record.amount,0);document.getElementById('total-deposit').textContent=money(deposits);document.getElementById('total-withdrawal').textContent=money(withdrawals);document.getElementById('total-commission').textContent=money(withdrawals*.042)};const openModal=id=>document.getElementById(id).classList.add('open');const closeModal=id=>document.getElementById(id).classList.remove('open');document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>closeModal(button.dataset.close)));document.getElementById('tutorial-button').addEventListener('click',()=>openModal('tutorial-modal'));document.getElementById('pin-button').addEventListener('click',()=>{document.getElementById('old-pin-label').style.display=localStorage.getItem('sbiPayPin')?'grid':'none';document.getElementById('pin-form').reset();document.getElementById('pin-error').textContent='';openModal('pin-modal')});document.getElementById('pin-form').addEventListener('submit',event=>{event.preventDefault();const saved=localStorage.getItem('sbiPayPin');const oldPin=document.getElementById('old-pin').value;const next=document.getElementById('new-pin').value;const confirm=document.getElementById('confirm-pin').value;const error=document.getElementById('pin-error');if(saved&&saved!==oldPin){error.textContent='Old PIN is incorrect.';return}if(!/^\d{4,6}$/.test(next)||next!==confirm){error.textContent='PINs must match and contain 4 to 6 digits.';return}localStorage.setItem('sbiPayPin',next);closeModal('pin-modal')});document.getElementById('logout-button').addEventListener('click',()=>openModal('logout-modal'));document.getElementById('confirm-logout').addEventListener('click',()=>{localStorage.removeItem('sbiPayUsername');window.location.href='login.html'});window.addEventListener('storage',renderAssets);renderAssets();
  </script>
</body>
</html>
