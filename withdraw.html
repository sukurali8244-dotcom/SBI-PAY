<script>document.addEventListener('DOMContentLoaded',()=>{const tabs=document.querySelector('.sell-status-filters');const all=tabs?.querySelector('[data-status="all"]');if(all)tabs.prepend(all);const timeout=tabs?.querySelector('[data-status="timeout"]');if(timeout)timeout.textContent='Time Out';const cancel=document.createElement('button');cancel.type='button';cancel.dataset.status='cancelled';cancel.setAttribute('role','tab');cancel.setAttribute('aria-selected','false');cancel.textContent='Cancel';tabs.append(cancel);sellOrders.length=0;renderOrders();cancel.addEventListener('click',()=>{status='cancelled';document.querySelectorAll('[data-status]').forEach(tab=>{const active=tab.dataset.status===status;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active))});renderOrders()});const applyStatusClass=()=>document.querySelectorAll('#sell-orders .order-card').forEach(card=>{const value=card.querySelector('.status-badge')?.textContent.toLowerCase().replace('•','').trim().replace(' ','-');if(value)card.classList.add('status-'+value)});new MutationObserver(applyStatusClass).observe(document.getElementById('sell-orders'),{childList:true});applyStatusClass()});</script>
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell Orders</title><link rel="stylesheet" href="dashboard.css"></head><body class="orders-page"><main class="app-shell orders-shell"><header class="orders-header"><a href="dashboard.html" aria-label="Back">←</a><h1>Sell Orders</h1></header><section class="orders-filters sell-filters"><div class="filter-row sell-status-filters" role="tablist" aria-label="Sell order status"><button class="active" data-status="pending" role="tab" aria-selected="true">Pending</button><button data-status="submitted" role="tab" aria-selected="false">Submitted</button><button data-status="success" role="tab" aria-selected="false">Success</button><button data-status="timeout" role="tab" aria-selected="false">Timeout</button><button data-status="all" role="tab" aria-selected="false">All</button></div></section><section class="order-list" id="sell-orders" aria-live="polite"></section></main><script>const sellOrders=[{code:'X6GsNb',amount:100,status:'success',date:'2026-09-15T18:35:21'},{code:'4kcxwN',amount:200,status:'success',date:'2026-09-15T14:16:09'},{code:'Q2bxDU',amount:300,status:'success',date:'2026-09-15T14:08:50'},{code:'mK7T8L',amount:150,status:'success',date:'2026-09-15T14:06:25'},{code:'NAYzlP',amount:200,status:'success',date:'2026-09-15T14:04:41'},{code:'bk7qrx',amount:75,status:'pending',date:'2026-09-15T13:50:00'},{code:'T8vLmQ',amount:120,status:'timeout',date:'2026-09-14T12:25:00'},{code:'aP4kLs',amount:250,status:'submitted',date:'2026-09-14T09:10:00'}];let status='pending';const list=document.getElementById('sell-orders');const formatDate=date=>date.replace('T',' ');function renderOrders(){const visible=sellOrders.filter(order=>status==='all'||order.status===status);list.innerHTML=visible.length?visible.map(order=>`<article class="order-card"><div class="order-card-top"><div class="order-code">code: <strong>${order.code}</strong><button class="copy-code" type="button" aria-label="Copy code">▤</button></div><span class="status-badge">• ${order.status[0].toUpperCase()+order.status.slice(1)}</span></div><div class="order-amount">₹ ${order.amount.toFixed(2)}</div><div class="order-card-bottom"><time>${formatDate(order.date)}</time><button class="sell-button" type="button">Sell</button></div></article>`).join(''):'<div class="empty-orders">No orders</div>';list.querySelectorAll('.copy-code').forEach(button=>button.addEventListener('click',()=>{const code=button.closest('.order-card').querySelector('.order-code strong').textContent;navigator.clipboard?.writeText(code);button.textContent='✓'}))}document.querySelectorAll('[data-status]').forEach(button=>button.addEventListener('click',()=>{status=button.dataset.status;document.querySelectorAll('[data-status]').forEach(tab=>{const active=tab.dataset.status===status;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active))});renderOrders()}));renderOrders();setInterval(renderOrders,60000);</script></body></html>
