<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message</title><link rel="stylesheet" href="dashboard.css"></head><body class="message-page"><main class="app-shell message-shell"><header class="message-header"><a href="dashboard.html" aria-label="Back">←</a><h1>Message</h1></header><section class="message-tabs" role="tablist"><button class="active" type="button" role="tab" aria-selected="true">Unread</button><button type="button" role="tab" aria-selected="false">All</button></section></main><script>document.querySelectorAll('.message-tabs button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.message-tabs button').forEach(tab=>{tab.classList.remove('active');tab.setAttribute('aria-selected','false')});button.classList.add('active');button.setAttribute('aria-selected','true')}));</script></body></html>
